name: release

# Push a version tag (vX.Y.Z) to publish to NuGet and create the GitHub release.
# NuGet trusted publishing (OIDC): no long-lived API key; secrets.NUGET_USER is the nuget.org account name.
# The trusted publishing policy pins this file name and the `release` environment.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            11.0.x

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild src/OnlineSim.Api/OnlineSim.Api.csproj -getProperty:Version)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the package version $version"
            exit 1
          fi

      - run: dotnet pack src/OnlineSim.Api/OnlineSim.Api.csproj -c Release -o artifacts/package
      - run: tests/smoke-artifact.sh artifacts/package

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # `dotnet nuget push` also pushes the .snupkg that sits next to each .nupkg.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/package/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists, skipping"
            exit 0
          fi
          awk -v v="${TAG#v}" '$0 == "## " v { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no '## ${TAG#v}' section in CHANGELOG.md"
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --latest --notes-file release-notes.md
