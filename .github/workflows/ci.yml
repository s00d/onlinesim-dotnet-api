name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }}, sdk ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdk: ['8.0', '11.0']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The tests target net8.0, plus net472 on Windows with SDK 9.0.300+ (see the test project): the .NET 8 runtime is needed with every SDK.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.sdk }}.x

      # Pin this job's SDK; `test.runner` opts the .NET 10+ SDKs into Microsoft.Testing.Platform (xunit.v3), older SDKs ignore it.
      - name: Pin SDK ${{ matrix.sdk }}
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          printf '{ "sdk": { "version": "%s.100", "rollForward": "latestFeature" }, "test": { "runner": "Microsoft.Testing.Platform" } }\n' "$SDK" > global.json
          dotnet --version

      # One formatter version: analyzers and formatting rules change between SDKs.
      - name: Format check
        if: matrix.sdk == '11.0' && runner.os == 'Linux'
        run: dotnet format OnlineSim.Api.sln --verify-no-changes

      - run: dotnet build OnlineSim.Api.sln -c Release
      - run: dotnet test -c Release --no-build

  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      # Package validation (EnablePackageValidation), Source Link and the .snupkg run as part of pack.
      - run: dotnet pack src/OnlineSim.Api/OnlineSim.Api.csproj -c Release -o artifacts/package
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/package/
          if-no-files-found: error

  # Install the packed .nupkg from a folder feed into an empty project and run the README "Testing" example:
  # net8.0 on both OSes, and .NET Framework 4.7.2 on Windows.
  smoke:
    name: smoke from artifact (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pin SDK 8.0
        run: |
          printf '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }\n' > global.json
          dotnet --version
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts/package
      - run: tests/smoke-artifact.sh artifacts/package
